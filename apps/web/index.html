<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenForge</title>
    <meta name="description" content="OpenForge 운영 콘솔" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("of-theme");
          var resolved = stored === "light" ? "light" : "dark";
          if (resolved === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
